name: TikTok download runner

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: tiktok-download-runner
  cancel-in-progress: false

jobs:
  process-one-video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install downloader
        run: |
          python -m pip install --upgrade yt-dlp
          yt-dlp --version

      - name: Validate JavaScript
        run: |
          node --check src/index.js
          node --check scripts/tiktok-runner.mjs

      - name: Process one queued TikTok video
        env:
          WORKER_URL: https://telegram-autopost.dovudbekpubg.workers.dev/
          RUNNER_SECRET: ${{ secrets.RUNNER_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$RUNNER_SECRET" ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Required repository secrets are not configured yet; skipping the runner."
            exit 0
          fi
          node scripts/tiktok-runner.mjs
